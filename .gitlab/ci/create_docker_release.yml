push_to_ghcr:
  image: quay.io/skopeo/stable:latest
  stage: release
  tags: [docker]
  variables:
    GITHUB_USERNAME: "dhufe"

  before_script:
    - echo "$GITHUB_TOKEN" | skopeo login -u "$GITHUB_USERNAME" --password-stdin ghcr.io
    - echo "$CI_REGISTRY_PASSWORD" | skopeo login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY

  script:
    - VERSION="$CI_COMMIT_TAG"
    - echo "🔄 Copying multi-arch image from GitLab to GHCR"
    - echo "   Source:$GITLAB_IMAGE:$VERSION"
    - echo "   Target:$GITHUB_IMAGE:$VERSION"
    - |
      # Copy mit --all für multi-arch support
      skopeo copy --all \
        docker://$GITLAB_IMAGE:$VERSION \
        docker://$GITHUB_IMAGE:$VERSION
    - echo "📌 Tagging as latest..."
    - |
      skopeo copy --all \
        docker://$GITLAB_IMAGE:$VERSION \
        docker://$GITHUB_IMAGE:latest
    - echo ""
    - echo "✅ Published to GHCR:"
    - echo "   📦 $GITHUB_IMAGE:$VERSION"
    - echo "   📌 $GITHUB_IMAGE:latest"
    - echo ""
    - echo "🔍 Verify with:"
    - echo "   docker pull $GITHUB_IMAGE:$VERSION"

  rules:
    - if: '$CI_COMMIT_TAG'
  dependencies: []
